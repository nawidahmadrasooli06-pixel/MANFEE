<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>بازی‌ها</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;font-family:Vazirmatn,Tahoma,sans-serif;color:#fff;background:#0a1a3f;user-select:none;-webkit-user-select:none}
body{height:100dvh;display:flex;flex-direction:column;align-items:center;padding:calc(10px + env(safe-area-inset-top,0px)) 14px calc(10px + env(safe-area-inset-bottom,0px));gap:clamp(6px,1.6dvh,12px);background:radial-gradient(ellipse at 50% 0%,#3a7be6,#1b4fb3 55%,#0a2866)}
.top{flex:none;text-align:center;line-height:1.15}
.vip{font-size:clamp(10px,1.7dvh,12px);font-weight:900;letter-spacing:.3em;color:#ffd76a;direction:ltr}
.ttl{font-size:clamp(20px,3.8dvh,30px);font-weight:900;text-shadow:0 3px 0 #0a2a6a}
.list{flex:1;min-height:0;width:100%;max-width:420px;display:flex;flex-direction:column;gap:clamp(8px,1.8dvh,14px)}
.card{position:relative;flex:1;min-height:0;border:0;border-radius:20px;color:#fff;font:inherit;display:flex;align-items:center;gap:12px;padding:0 16px;text-align:right;overflow:hidden;box-shadow:0 6px 0 #0007,0 12px 18px #0006;transition:transform .08s,box-shadow .08s;cursor:pointer}
.card:active{transform:translateY(5px);box-shadow:0 1px 0 #0007,0 4px 8px #0006}
.card.mf{background:linear-gradient(135deg,#2f9e63,#0f5c3a)}.card.fk{background:linear-gradient(135deg,#d6455d,#7d1530)}.card.ld{background:linear-gradient(135deg,#f6b73a,#d77a0c);color:#2b1a00}
.ic{flex:none;width:clamp(46px,9dvh,72px);height:clamp(46px,9dvh,72px);border-radius:50%;background:#ffffff2b;border:3px solid #ffffff88;display:flex;align-items:center;justify-content:center;font-size:clamp(26px,5.2dvh,40px);box-shadow:inset 0 -4px 0 #0003}
.tx{flex:1;min-width:0}.nm{font-size:clamp(17px,3.2dvh,24px);font-weight:900;line-height:1.2}.ds{font-size:clamp(10.5px,1.8dvh,13px);opacity:.88;font-weight:700;margin-top:2px}
.go{flex:none;font-size:clamp(20px,3.6dvh,28px);opacity:.9}
.help{position:absolute;left:8px;top:8px;width:28px;height:28px;border-radius:50%;background:#0004;border:1.5px solid #fff8;color:#fff;font-size:14px;display:flex;align-items:center;justify-content:center}
.bar{flex:none;display:flex;gap:10px;width:100%;max-width:420px}
.bar button{flex:1;border:0;border-radius:14px;padding:clamp(7px,1.5dvh,11px) 6px;font:inherit;font-weight:800;font-size:clamp(11.5px,1.9dvh,14px);color:#fff;background:linear-gradient(#3a7be6,#1a4fb0);border-bottom:3px solid #0a2a6a}
.bar button:active{transform:translateY(2px)}
.id{flex:none;font-size:10px;font-weight:700;letter-spacing:.06em;color:#ffffff59;direction:ltr}
.md{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:18px;z-index:9}
.md.on{display:flex}
.bx{width:100%;max-width:360px;max-height:84dvh;overflow:auto;background:#0b2a6e;border:3px solid #ffd76a;border-radius:20px;padding:16px;text-align:center;line-height:1.9;font-size:13.5px}
.bx h3{margin:0 0 6px;color:#ffd76a;font-size:18px}.bx p{margin:4px 0;text-align:right}
.bx .x{margin-top:10px;border:0;border-radius:12px;padding:8px 22px;font:inherit;font-weight:900;background:#ffd35a;color:#1b2a6b}
.av{width:72px;height:72px;border-radius:50%;object-fit:cover;border:3px solid #ffd76a;margin:0 auto 6px;display:block;background:#0a1a3f}
</style>
</head>
<body>
<div class="top"><div class="vip">VIP · CACTUC</div><div class="ttl">🎮 بازی‌ها</div></div>
<div class="list">
  <button class="card ld" onclick="go('/ludo.html')"><span class="help" onclick="event.stopPropagation();guide('ld')">❓</span><div class="ic">🎲</div><div class="tx"><div class="nm">لودو</div><div class="ds">۲ تا ۴ نفر · تکی یا ۲ در ۲</div></div><div class="go">◀</div></button>
  <button class="card fk" onclick="go('/fiskoot.html')"><span class="help" onclick="event.stopPropagation();guide('fk')">❓</span><div class="ic">♥</div><div class="tx"><div class="nm">حکم (فیسکوت)</div><div class="ds">۴ نفره · دو تیم دونفره</div></div><div class="go">◀</div></button>
  <button class="card mf" onclick="go('/?m=1')"><span class="help" onclick="event.stopPropagation();guide('mf')">❓</span><div class="ic">♠</div><div class="tx"><div class="nm">منفی</div><div class="ds">۴ نفره · دو تیم دونفره</div></div><div class="go">◀</div></button>
</div>
<div class="bar"><button onclick="prof()">👤 پروفایل من</button><button onclick="about()">ℹ️ درباره ربات</button></div>
<div class="id">@cactuc580</div>
<div class="md" id="md" onclick="if(event.target===this)cl()"><div class="bx" id="bx"></div></div>
<script>
try{Telegram.WebApp.ready();Telegram.WebApp.expand();Telegram.WebApp.disableVerticalSwipes&&Telegram.WebApp.disableVerticalSwipes()}catch(e){}
const $=id=>document.getElementById(id);
function go(u){location.href=u}
function cl(){$('md').classList.remove('on')}
function show(h){$('bx').innerHTML=h+'<br><button class="x" onclick="cl()">بستن</button>';$('md').classList.add('on')}
const G={
 ld:'<h3>🎲 راهنمای لودو</h3><p>• تاس را بزن؛ با ۶ مهره از خانه بیرون می‌آید.</p><p>• اگر روی مهرهٔ حریف بیفتی (به‌جز خانه‌های شروع و ستاره‌ها ★) آن مهره به خانه برمی‌گردد.</p><p>• ۶، زدن مهره و رساندن مهره به وسط، تاس دوباره می‌دهد؛ سه ۶ پشت‌سرهم نوبت را می‌سوزاند.</p><p>• برای رسیدن به وسط باید تاس دقیق بیاید.</p><p>• در حالت «۲ در ۲» یارها ضربدری‌اند؛ تیمی که هر ۸ مهره‌اش به وسط برسد برنده است.</p>',
 fk:'<h3>♥ راهنمای حکم (فیسکوت)</h3><p>• ۴ نفر، دو تیم؛ هم‌تیمی روبه‌روی توست.</p><p>• هر کس اول آس بیاورد حاکم می‌شود و حکم را می‌گوید.</p><p>• باید از خال شروع‌شده بازی کنی؛ نداری، می‌توانی حکم یا خال دیگری بزنی.</p><p>• هر تیم به ۷ دست برسد دست را می‌برد؛ اولین تیمی که به ۱۳ امتیاز برسد برنده است.</p>',
 mf:'<h3>♠ راهنمای منفی</h3><p>• ۴ نفر، دو تیم دونفره؛ هم‌تیمی‌ها روبه‌روی هم می‌نشینند.</p><p>• هر نفر می‌گوید چند دست می‌گیرد؛ ادعای تیم جمع دو هم‌تیمی است.</p><p>• پیک حکم است. هر تیمی که به ۵ برد برسد، مسابقه را می‌برد.</p>'};
function guide(k){show(G[k])}
function about(){show('<h3>ℹ️ درباره ربات</h3><p style="text-align:center">🃏 ربات بازی منفی، حکم (فیسکوت) و لودو؛ بازی با دوستان یا ربات‌ها.</p><p style="text-align:center">طراح: <b>نــوید = Cactuc</b></p><p style="text-align:center;direction:ltr"><b>@cactuc580</b></p>')}
function prof(){let u=null;try{u=Telegram.WebApp.initDataUnsafe.user}catch(e){}
 if(!u){show('<h3>👤 پروفایل من</h3><p style="text-align:center">برای دیدن پروفایل، بازی را از داخل تلگرام باز کن.</p>');return}
 const n=[u.first_name,u.last_name].filter(Boolean).join(' ');
 show((u.photo_url?'<img class="av" src="'+u.photo_url+'">':'<div class="av" style="line-height:66px;font-size:34px">👤</div>')+'<h3>'+n.replace(/</g,'&lt;')+'</h3><p style="text-align:center">'+(u.username?'@'+u.username:'—')+'</p><p style="text-align:center;direction:ltr;opacity:.8">ID: '+u.id+'</p>')}
</script>
</body>
</html>
