<script>const SV=(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}},LD=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const $=id=>document.getElementById(id);
let tok=LD('fk_tok');if(!tok){tok=Math.random().toString(36).slice(2)+Date.now().toString(36);SV('fk_tok',tok)}
let st=null,pv=null,dis=null;
const sk=io('/ludo');
sk.on('connect',()=>{try{if(Telegram.WebApp.initData)sk.emit('auth',{initData:Telegram.WebApp.initData})}catch(e){}if(st&&st.code){if(st.isSpec)sk.emit('watch',{code:st.code});else sk.emit('rejoin',{code:st.code,token:tok})}});
sk.on('st',s=>{pv=st?st.ph:null;st=s;if(!s.isSpec)SV('ld_room',s.code);try{SOC.onState(s)}catch(e){}try{setSpec(s.spec||0);syncTrackFromState(s.track,s.playing)}catch(e){}onSt()});
sk.on('err',m=>toast(m));
sk.on('gone',()=>{SV('ld_room',null);st=null;$('rsm').style.display='none';scr('menu');toast('این اتاق دیگر وجود ندارد')});
let pend=null;
sk.on('pick',d=>{pend={code:d.code};const W=$('wt');W.innerHTML='<div class="box"><h2>به کدام صندلی می‌نشینی؟</h2>بازی شروع شده؛ جای یکی از ربات‌ها می‌نشینی:'+d.list.map(x=>`<button class="btn go" style="margin-top:8px" onclick="takeSeat(${x.k})">${NAMES[x.k]}: ${x.n} (bot)</button>`).join('')+'</div>';W.style.display='flex'});
function takeSeat(k){$('wt').style.display='none';sk.emit('take',{code:pend.code,name:nameV()||'بازیکن',token:tok,seat:k})}
function toast(t){const e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2800)}
function scr(n){$('menu').style.display=n=='menu'?'flex':'none';$('lobby').style.display=n=='lobby'?'flex':'none';$('game').style.display=n=='game'?'flex':'none'}
function nameV(){const n=($('nm').value||'').trim();if(!n){toast('اسمت را بنویس');return null}SV('fk_nm',n);return n}
function mkRoom(){const n=nameV();if(n)sk.emit('create',{name:n,token:tok})}
function joinCode(){const n=nameV(),c=$('cin').value.trim().toUpperCase();if(n&&c)sk.emit('join',{code:c,name:n,token:tok})}
function resume(){sk.emit('rejoin',{code:LD('ld_room'),token:tok})}
function sit(k){sk.emit('sit',k)}
function exitG(){if(confirm('از بازی خارج می‌شوی؟ بعداً با همان کد برمی‌گردی.'))location.href='/'}
function shareTo(code,pre,text){const go=l=>{const u='https://t.me/share/url?url='+encodeURIComponent(l)+'&text='+encodeURIComponent(text);try{Telegram.WebApp.openTelegramLink(u)}catch(e){window.open(u,'_blank')}};fetch('/config').then(r=>r.json()).then(c=>go(c.bot?'https://t.me/'+c.bot+'?start='+pre+code:location.origin+'/ludo.html?'+(pre=='ldw_'?'watch':'room')+'='+code)).catch(()=>go(location.origin+'/ludo.html?'+(pre=='ldw_'?'watch':'room')+'='+code))}
function invite(){shareTo(st.code,'ld_','بیا لودو بازی کنیم! 🎲 کد اتاق: '+st.code)}
function inviteWatch(){shareTo(st.code,'ldw_','بیا بازی لودو را زنده تماشا کن! 👁 کد اتاق: '+st.code)}
function onSt(){if(st.ph=='lobby'){scr('lobby');rLobby();clearGame()}else{scr('game');if(pv==='lobby'||pv==null)resetGame();onGame(st)}}

/* ---------- لابی ---------- */
function rLobby(){$('rc').textContent=st.code;
 $('cntRow').innerHTML=[2,3,4].map(n=>`<button class="btn ${st.n==n?'go':''}" style="width:auto;padding:6px 14px!important" ${st.host?`onclick="sk.emit('cnt',${n})"`:'disabled'}>${n} نفره</button>`).join('');
 $('room').innerHTML=st.act.map(k=>{const s=st.seats[k];const dot=`<span class="dot" style="background:${COL[k]}"></span>`;
  return s?`<div class="st ${k==st.me?'me':''}" ${k!=st.me&&s.on?`onclick="SOC.swap(${k})"`:''}>${dot} ${s.n}${k==st.me?' (تو)':''}${!s.on?' ⚠ قطع شد':''}</div>`:`<div class="st" onclick="sit(${k})">${dot} خالی ← ربات (بزن تا بنشینی)</div>`}).join('');
 const full=st.act.every(k=>st.seats[k]&&st.seats[k].on);
 $('go').style.display=$('gob').style.display=st.host?'block':'none';$('go').disabled=!full;$('go').style.opacity=full?1:.4;
 $('lm').textContent=st.isSpec?'👁 تو تماشاچی هستی؛ منتظر شروع بازی…':st.host?(full?'همه آمده‌اند؛ شروع کن.':'تا همهٔ صندلی‌ها پر نشود «شروع بازی» فعال نمی‌شود. یا با ربات شروع کن.'):'منتظر شروع بازی توسط میزبان…'}

/* ---------- هندسهٔ تخته ---------- */
const COL=['#2e9d46','#f2b01e','#2b7fe0','#d8382f'],DK=['#1b6b2d','#b87d00','#1a58a8','#9b231c'],NAMES=['سبز','زرد','آبی','قرمز'];
const C=24,RING=[],add=(r,c)=>RING.push([r,c]);
for(let c=1;c<=5;c++)add(6,c);for(let r=5;r>=0;r--)add(r,6);add(0,7);add(0,8);
for(let r=1;r<=5;r++)add(r,8);for(let c=9;c<=14;c++)add(6,c);add(7,14);add(8,14);
for(let c=13;c>=9;c--)add(8,c);for(let r=9;r<=14;r++)add(r,8);add(14,7);add(14,6);
for(let r=13;r>=9;r--)add(r,6);for(let c=5;c>=0;c--)add(8,c);add(7,0);add(6,0);
const START=[0,13,26,39],STARS=[8,21,34,47];
const HOME=[[1,2,3,4,5].map(c=>[7,c]),[1,2,3,4,5].map(r=>[r,7]),[13,12,11,10,9].map(c=>[7,c]),[13,12,11,10,9].map(r=>[r,7])];
const YARD=[[0,0],[9,0],[9,9],[0,9]],cc=(r,c)=>({x:c*C+C/2,y:r*C+C/2});
function coord(s,p,t){
 if(p===-1){const y=YARD[s];return{x:(y[0]+[2,4][t%2])*C,y:(y[1]+[2,4][t>>1])*C}}
 if(p<=50){const q=RING[(START[s]+p)%52];return cc(q[0],q[1])}
 if(p<=55){const q=HOME[s][p-51];return cc(q[0],q[1])}
 const o=[[-1,0],[0,-1],[1,0],[0,1]][s];return{x:7.5*C+o[0]*10,y:7.5*C+o[1]*10}}
const NS='http://www.w3.org/2000/svg';
function E(t,a,p){const n=document.createElementNS(NS,t);for(const k in a)n.setAttribute(k,a[k]);(p||$('bd')).appendChild(n);return n}
const el={},cur={};let built=false;
function build(){if(built)return;built=true;const bd=$('bd');bd.innerHTML='';
 E('rect',{x:-4,y:-4,width:368,height:368,rx:14,fill:'#fff',stroke:'#d4af37','stroke-width':3});
 YARD.forEach((y,s)=>{E('rect',{x:y[0]*C,y:y[1]*C,width:6*C,height:6*C,fill:COL[s]});E('rect',{x:(y[0]+1)*C,y:(y[1]+1)*C,width:4*C,height:4*C,rx:12,fill:'#fff'});
  for(let t=0;t<4;t++){const q=coord(s,-1,t);E('circle',{cx:q.x,cy:q.y,r:11,fill:'none',stroke:COL[s],'stroke-opacity':.5,'stroke-width':1.5})}});
 RING.forEach((q,i)=>{const s=START.indexOf(i);E('rect',{x:q[1]*C,y:q[0]*C,width:C,height:C,fill:s>=0?COL[s]:'#fff',stroke:'#cfcfcf','stroke-width':.6})});
 HOME.forEach((h,s)=>h.forEach(q=>E('rect',{x:q[1]*C,y:q[0]*C,width:C,height:C,fill:COL[s],stroke:'#fff','stroke-opacity':.5,'stroke-width':.6})));
 STARS.forEach(i=>{const q=RING[i],t=E('text',{x:q[1]*C+C/2,y:q[0]*C+C/2+5,'text-anchor':'middle','font-size':15,fill:'#e5a100'});t.textContent='★'});
 [[7,0,'M4,6 L20,12 L4,18Z',0],[0,7,'M6,4 L12,20 L18,4Z',1],[7,14,'M20,6 L4,12 L20,18Z',2],[14,7,'M6,20 L12,4 L18,20Z',3]].forEach(([r,c,d,s])=>E('path',{d,fill:COL[s],transform:`translate(${c*C},${r*C})`,opacity:.9}));
 const m=7.5*C,L=6*C,R=9*C,T=6*C,B=9*C;
 [[0,[L,T,L,B]],[1,[L,T,R,T]],[2,[R,T,R,B]],[3,[L,B,R,B]]].forEach(([s,p])=>E('polygon',{points:`${p[0]},${p[1]} ${p[2]},${p[3]} ${m},${m}`,fill:COL[s]}));
 E('rect',{x:0,y:0,width:360,height:360,rx:10,fill:'none',stroke:'#d4af37','stroke-width':2});
 const tl=E('g',{id:'tl'});
 for(let s=0;s<4;s++)for(let t=0;t<4;t++){
  const g=E('g',{class:'tk'},tl),i=E('g',{class:'in'},g);
  E('ellipse',{cx:0,cy:7,rx:7,ry:2.6,fill:'#000','fill-opacity':.28},i);
  E('circle',{class:'hl',cx:0,cy:-4,r:13,fill:'none',stroke:'#d4af37','stroke-width':2,'stroke-dasharray':'4 3',opacity:0},i);
  E('path',{d:'M0,7 C-3,3 -9,0 -9,-8 A9,9 0 0 1 9,-8 C9,0 3,3 0,7Z',fill:COL[s],stroke:DK[s],'stroke-width':1.4},i);
  E('circle',{cx:0,cy:-8,r:3.8,fill:'#fff','fill-opacity':.9},i);E('circle',{cx:-3.5,cy:-12.5,r:2,fill:'#fff','fill-opacity':.6},i);
  E('circle',{cx:0,cy:-6,r:16,fill:'transparent'},i);
  g.onclick=()=>{if(g.classList.contains('mvb'))sk.emit('move',t)};el[s*4+t]=g;cur[s*4+t]={x:0,y:0}}}
function setPos(k,x,y,lift){el[k].setAttribute('transform',`translate(${x},${y-6-(lift||0)})`);cur[k]={x,y}}
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
function tween(k,to,ms,hop){return new Promise(res=>{const a={...cur[k]},t0=performance.now();const f=now=>{const u=Math.min(1,(now-t0)/ms),e=ease(u);setPos(k,a.x+(to.x-a.x)*e,a.y+(to.y-a.y)*e,hop?Math.sin(Math.PI*u)*7:0);if(u<1)requestAnimationFrame(f);else{setPos(k,to.x,to.y,0);res()}};requestAnimationFrame(f)})}
async function animateMove(mv){const k=mv.s*4+mv.t,pts=[];$('tl').appendChild(el[k]);
 if(mv.f===-1)pts.push(coord(mv.s,0));else for(let p=mv.f+1;p<=mv.to;p++)pts.push(coord(mv.s,p,mv.t));
 for(const pt of pts)await tween(k,pt,mv.f===-1?520:260,true);
 if(mv.caps.length)await Promise.all(mv.caps.map(c=>tween(c[0]*4+c[1],coord(c[0],-1,c[1]),600,true)))}

/* ---------- تاس ---------- */
const lastDice=[0,0,0,0],ON={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
const face=v=>Array.from({length:9},(_,i)=>`<i${(ON[v]||[]).includes(i)?' class="on"':''}></i>`).join('');
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function diceAnim(seat,v){const d=$('d'+seat);d.classList.add('roll');for(let i=0;i<8;i++){d.innerHTML=face(1+Math.random()*6|0);await sleep(85)}d.classList.remove('roll');lastDice[seat]=v;d.innerHTML=face(v)}
$('d0').onclick=$('d1').onclick=$('d2').onclick=$('d3').onclick=function(){const i=+this.id[1];if(st&&!st.isSpec&&st.me===i&&st.turn===i&&st.stage==='roll'&&!pendN)sk.emit('roll')};

/* ---------- صف انیمیشن‌ها و نمایش ---------- */
let Q=Promise.resolve(),lastSeq=-1,lastRs=-1,pendN=0,lastFin=0;
function resetGame(){lastSeq=-1;lastRs=-1;lastFin=0;for(let i=0;i<4;i++)lastDice[i]=0}
function clearGame(){$('bw').style.display='none'}
function onGame(s){
 build();
 if(lastSeq===-1){lastSeq=s.mv?s.mv.seq:0;lastRs=s.rs;lastFin=(s.fin||[]).length;if(s.dice)lastDice[s.turn]=s.dice;pendN++;Q=Q.then(()=>renderAll(s)).then(()=>pendN--);return}
 pendN++;
 if(s.rs!==lastRs){lastRs=s.rs;const seat=s.turn,v=s.dice;Q=Q.then(()=>diceAnim(seat,v))}
 if(s.mv&&s.mv.seq!==lastSeq){lastSeq=s.mv.seq;const mv=s.mv;Q=Q.then(()=>animateMove(mv))}
 Q=Q.then(()=>renderAll(s)).then(()=>pendN--);
 announceFin(s);
}
const CROWN=['👑','🥈','🥉'],ORDN=['اول','دوم','سوم'];
function announceFin(s){const f=s.fin||[];if(f.length>lastFin){const k=f[f.length-1],n=(s.seats[k]&&s.seats[k].n)||NAMES[k],b=$('fnb');lastFin=f.length;Q=Q.then(()=>{b.textContent=CROWN[f.length-1]+' '+n+' '+ORDN[f.length-1]+' شد!';b.style.display='block';b.style.animation='none';void b.offsetWidth;b.style.animation='';clearTimeout(announceFin.t);announceFin.t=setTimeout(()=>b.style.display='none',2800)})}else lastFin=f.length}
function renderAll(s){
 if(st!==s&&st&&st.code!==s.code)return;
 const act=s.act,groups={};
 for(let q=0;q<4;q++){const on=act.includes(q);$('ps'+q).style.display=on?'flex':'none';
  const sd=s.seats[q];$('pn'+q).textContent=sd?sd.n:NAMES[q];
  const fi=(s.fin||[]).indexOf(q);$('cr'+q).textContent=fi>=0?CROWN[fi]||'':'';$('ps'+q).classList.toggle('fin',fi>=0);
  $('ps'+q).classList.toggle('on',s.ph==='play'&&s.turn===q);
  const d=$('d'+q);if(!d.classList.contains('roll'))d.innerHTML=face(lastDice[q]);
  d.classList.toggle('can',!s.isSpec&&s.me===q&&s.turn===q&&s.stage==='roll'&&s.ph==='play');
  for(let t=0;t<4;t++){const k=q*4+t,g=el[k];g.style.display=on?'':'none';if(!on)continue;
   const p=s.pos?s.pos[q][t]:-1,c=coord(q,p,t),key=Math.round(c.x)+','+Math.round(c.y);(groups[key]=groups[key]||[]).push([k,c,p])}}
 for(const key in groups){const a=groups[key],n=a.length;a.forEach(([k,c,p],i)=>{const off=p===-1?0:(i-(n-1)/2)*5;setPos(k,c.x+off,c.y)})}
 const mov=s.mov||[];
 for(let q=0;q<4;q++)for(let t=0;t<4;t++){const g=el[q*4+t],on=!s.isSpec&&q===s.me&&mov.includes(t)&&s.stage==='move';g.classList.toggle('mvb',on);g.querySelector('.hl').setAttribute('opacity',on?1:0)}
 const nm=q=>(s.seats[q]&&s.seats[q].n)||NAMES[q];let m='';
 if(s.ph==='over')m='🏆 بازی تمام شد';
 else if((s.fin||[]).includes(s.me)&&!s.isSpec)m='تو تمام کردی 👑؛ بقیه هنوز بازی می‌کنند';
 else if(s.stage==='roll')m=(!s.isSpec&&s.me===s.turn)?'نوبت توست؛ تاس را بزن 🎲':'نوبت '+nm(s.turn);
 else if(s.stage==='move')m=(!s.isSpec&&s.me===s.turn)?'یکی از مهره‌های چشمک‌زن را انتخاب کن':nm(s.turn)+' در حال انتخاب مهره…';
 else m=s.six?'سه شش پشت‌سرهم؛ نوبت رد می‌شود':'حرکتی ممکن نیست؛ نوبت رد می‌شود';
 $('lmsg').textContent=m;
 const W=$('wt');if(s.wait!=null&&!s.isSpec&&dis!==s.wait){W.innerHTML=`<div class="box"><h2>${nm(s.wait)} قطع شد</h2>بازی منتظر او می‌ماند.<br><button onclick="dis=st.wait;$('wt').style.display='none'">منتظر می‌مانیم</button><button class="btn go" style="margin-top:8px" onclick="sk.emit('replace')">جایگزینش ربات</button></div>`;W.style.display='flex'}else{W.style.display='none';if(s.wait==null)dis=null}
 try{SOC.afterDraw(s)}catch(e){}
}
const u=new URLSearchParams(location.search),wq=u.get('watch'),rq=u.get('room');
try{Telegram.WebApp.ready();Telegram.WebApp.expand()}catch(e){}
$('nm').value=LD('fk_nm')||(()=>{try{return Telegram.WebApp.initDataUnsafe.user.first_name}catch(e){return ''}})()||'';
if(rq){$('cin').value=rq.toUpperCase();$('inv').style.display='block'}
if(wq){const go=()=>sk.emit('watch',{code:wq});sk.connected?go():sk.once('connect',go)}
if(LD('ld_room')){$('rsm').style.display='block';$('rcode').textContent=LD('ld_room')}
</script>
