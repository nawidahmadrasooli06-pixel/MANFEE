<!doctype html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
    <title>منفی | فیسکوت</title>
    <!-- اینجا استایل‌های منوی اصلی خودت رو بذار -->
    <link rel="stylesheet" href="style.css"> 
</head>
<body>
    <!-- محتویات منوی اصلی و دکمه‌های بازی‌ها (همون عکسی که فرستادی) -->
    <div class="menu-container">
        <h1>منفی ♠ فیسکوت</h1>
        
        <!-- دکمه‌های بازی‌های دیگر (بدون تغییر و سالم کار می‌کنند) -->
        <a href="fiskoot.html" class="game-btn">شروع بازی منفی</a>
        <a href=" حکم.html" class="game-btn">بازی حکم (فیسکوت)</a>
        
        <!-- دکمه لودو کاکتوس (با آی‌دی مخصوص برای کنترل کلیک) -->
        <a href="#" id="ludoBtn" class="game-btn">لودو کینگ · CACTUC 🎲</a>
        
        <a href="settings.html" class="game-btn">تنظیمات، تم و موزیک</a>
        <a href="profile.html" class="game-btn">پروفایل من</a>
    </div>

    <!-- اسکریپت کنترل کلیک روی دکمه لودو کاکتوس -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const ludoButton = document.getElementById('ludoBtn');

            if (ludoButton) {
                ludoButton.addEventListener('click', function(e) {
                    e.preventDefault(); // جلوگیری از رفتن پیش‌فرض

                    const myAdminId = 8659480577; // آی‌دی عددی تلگرام شما
                    let isCreator = false;

                    // بررسی اینکه آیا کاربرِ بازکننده ربات خودِ شما هستید یا خیر
                    if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initDataUnsafe) {
                        const user = window.Telegram.WebApp.initDataUnsafe.user;
                        if (user && Number(user.id) === myAdminId) {
                            isCreator = true;
                        }
                    }

                    if (isCreator) {
                        // اگر خودت بودی، وارد صفحه بازی لودو میشی تا تست کنی
                        window.location.href = 'ludo.html'; 
                    } else {
                        // اگر بازیکنان عادی بودن، این پیام خوشگل نمایش داده میشه
                        alert("پروژه در حال ساخته. از شکیبایی شما تشکر. به زودی بازی منتشر میشه ❤️");
                    }
                });
            }
        });
    </script>
</body>
</html>
